<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="SiteShield weighted scoring model">
<title>SiteShield weighted scoring model</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030712"/>
    <stop offset="0.6" stop-color="#04140f"/>
    <stop offset="1" stop-color="#022c22"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#10b981" stroke-opacity="0.07"/>
  </pattern>
  <clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>
  <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  
  <text x="40" y="56" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#6ee7b7">WEIGHTED SECURITY GRADE</text>
  <path d="M100 250 A150 150 0 0 1 400 250" fill="none" stroke="#111827" stroke-width="34"/>
  <g filter="url(#bloom)" opacity="0.95"><path d="M100.0 248.1 A150 150 0 0 1 127.5 163.4" fill="none" stroke="#dc2626" stroke-width="22"/><path d="M129.8 160.3 A150 150 0 0 1 201.9 107.9" fill="none" stroke="#ea580c" stroke-width="22"/><path d="M205.4 106.8 A150 150 0 0 1 294.6 106.8" fill="none" stroke="#f97316" stroke-width="22"/><path d="M298.1 107.9 A150 150 0 0 1 354.7 142.6" fill="none" stroke="#eab308" stroke-width="22"/><path d="M357.4 145.3 A150 150 0 0 1 392.1 201.9" fill="none" stroke="#84cc16" stroke-width="22"/><path d="M393.2 205.4 A150 150 0 0 1 400.0 248.1" fill="none" stroke="#10b981" stroke-width="22"/></g>
  <text x="76.9" y="198.8" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#dc2626">F</text><text x="143.0" y="107.8" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#ea580c">E</text><text x="250.0" y="73.0" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#f97316">D</text><text x="345.1" y="99.8" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#eab308">C</text><text x="405.2" y="159.9" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#84cc16">B</text><text x="429.8" y="226.5" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#10b981">A</text>
  <g><line x1="250" y1="250" x2="250" y2="118" stroke="#f9fafb" stroke-width="4" stroke-linecap="round"/><circle cx="250" cy="250" r="11" fill="#f9fafb"/><circle cx="250" cy="250" r="5" fill="#10b981"/><animateTransform attributeName="transform" type="rotate" values="-90 250 250;-90 250 250;83.6 250 250;72.6 250 250;75.6 250 250;75.6 250 250;-90 250 250" keyTimes="0;0.05;0.3;0.36;0.42;0.9;1" dur="9.0s" repeatCount="indefinite"/></g>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3111;0.3500;0.8889;0.9278;1" dur="9.0s" repeatCount="indefinite"/><text x="250" y="310" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#f9fafb">92<tspan font-size="20" fill="#9ca3af">/100</tspan></text><rect x="204" y="326" width="92" height="28" rx="14" fill="#10b981"/><text x="250" y="345" text-anchor="middle" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#ffffff">GRADE A</text></g>
  <text x="560" y="56" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#6ee7b7">CATEGORY WEIGHTS</text><text x="1150" y="56" text-anchor="end" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#6ee7b7">CONTRIBUTION</text><text x="560" y="92" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#f3f4f6">HTTP security headers</text><text x="940" y="92" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#6ee7b7">35%</text><rect x="560" y="102" width="380" height="12" rx="6" fill="#1f2937"/><rect x="560" y="102" width="0" height="12" rx="6" fill="#10b981"><animate attributeName="width" values="0;0;380;380;0" keyTimes="0;0.0333;0.1444;0.9;1" dur="9.0s" repeatCount="indefinite"/></rect><text x="1150" y="113" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#9ca3af"> 90 × .35 = <tspan fill="#f9fafb">31.5</tspan></text><text x="560" y="148" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#f3f4f6">TLS / SSL</text><text x="940" y="148" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#6ee7b7">30%</text><rect x="560" y="158" width="380" height="12" rx="6" fill="#1f2937"/><rect x="560" y="158" width="0" height="12" rx="6" fill="#10b981"><animate attributeName="width" values="0;0;326;326;0" keyTimes="0;0.0722;0.1833;0.9;1" dur="9.0s" repeatCount="indefinite"/></rect><text x="1150" y="169" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#9ca3af">100 × .30 = <tspan fill="#f9fafb">30.0</tspan></text><text x="560" y="204" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#f3f4f6">DNS &amp; email</text><text x="940" y="204" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#6ee7b7">20%</text><rect x="560" y="214" width="380" height="12" rx="6" fill="#1f2937"/><rect x="560" y="214" width="0" height="12" rx="6" fill="#10b981"><animate attributeName="width" values="0;0;217;217;0" keyTimes="0;0.1111;0.2222;0.9;1" dur="9.0s" repeatCount="indefinite"/></rect><text x="1150" y="225" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#9ca3af"> 75 × .20 = <tspan fill="#f9fafb">15.0</tspan></text><text x="560" y="260" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#f3f4f6">Cookies</text><text x="940" y="260" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#6ee7b7">15%</text><rect x="560" y="270" width="380" height="12" rx="6" fill="#1f2937"/><rect x="560" y="270" width="0" height="12" rx="6" fill="#10b981"><animate attributeName="width" values="0;0;163;163;0" keyTimes="0;0.1500;0.2611;0.9;1" dur="9.0s" repeatCount="indefinite"/></rect><text x="1150" y="281" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15" fill="#9ca3af">100 × .15 = <tspan fill="#f9fafb">15.0</tspan></text>
  <text x="560" y="322" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9ca3af">Unreachable categories are dropped and the remaining weights re-normalised —</text><text x="560" y="342" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9ca3af">a connection failure is never scored as a failed check. No category scored → <tspan fill="#d4d4d8" font-weight="700">N/A</tspan>.</text>

</g>
<rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="21.5" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
